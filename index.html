const icons={"คณิตศาสตร์":"🔢","วิทยาศาสตร์":"🔬","ภาษาไทย":"📚","ภาษาอังกฤษ":"🇬🇧"};let name,qs,n=0,score=0,selected=null;
function parse(s){return s.split('\n').map(x=>{let a=x.split('|');return{q:a[0],c:a[1].split(','),a:+a[2],e:a[3]}})}
function home(){app.innerHTML=`<h1>SKBB Practice</h1><p class="sub">ซ้อมสอบเข้า ม.1 • ใช้งานออฟไลน์ได้</p><h2>เลือกวิชาที่ต้องการฝึก</h2>${Object.keys(banks).map(k=>`<div class="card"><button class="subject" onclick="start('${k}')"><b class="icon">${icons[k]}</b><div><strong>${k}</strong><span>20 ข้อ • พร้อมเฉลย</span></div><b class="right">›</b></button></div>`).join('')}<p class="foot">เนื้อหาเป็นแนวฝึกหัด ไม่ใช่ข้อสอบจริงของโรงเรียน</p>`}
function start(k){name=k;qs=parse(banks[k]);n=0;score=0;selected=null;show()}
function show(){let q=qs[n], answered=selected!==null;app.innerHTML=`<button onclick="home()" style="border:0;background:none;color:#155eef;font-size:15px">‹ กลับหน้าหลัก</button><p><b>${name}</b> <span style="float:right;color:#667085">ข้อ ${n+1}/20</span></p><div class="progress"><i style="width:${n/20*100}%"></i></div><div class="card question">${q.q}</div>${q.c.map((c,i)=>`<button ${answered?'disabled':''} class="choice ${answered?(i===q.a?'correct':i===selected?'wrong':''):''}" onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${c}</button>`).join('')}${answered?`<div class="notice"><b>${selected===q.a?'ถูกต้อง!':'เฉลย: '+q.c[q.a]}</b><br>${q.e}</div><button class="next" onclick="next()">${n===19?'ดูผลคะแนน':'ข้อต่อไป'}</button>`:''}`}
function answer(i){selected=i;if(i===qs[n].a)score++;show()}function next(){if(n++===19){result()}else{selected=null;show()}}function result(){app.innerHTML=`<div class="result"><div style="font-size:65px">${score>=16?'🏆':'📖'}</div><h1>ทำได้เยี่ยม!</h1><p class="sub">${name}</p><div class="score">${score} / 20</div><p>${score>=16?'พร้อมลุยต่อเลย':'ทบทวนเฉลยแล้วลองใหม่อีกครั้งนะ'}</p><button class="next" onclick="start(name)">ทำชุดนี้อีกครั้ง</button><button class="next" style="background:#667085" onclick="home()">เลือกวิชาอื่น</button></div>`}const app=document.querySelector('#app');home();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script></main></body></html>
